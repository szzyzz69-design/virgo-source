name: virgo-supervisor-readonly

services:
  supervisor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: virgo-supervisor-readonly:latest
    restart: unless-stopped
    # 3x capacity target for the read-only supervisor service.
    cpus: 1.0
    cpu_shares: 1024
    mem_limit: 2g
    mem_reservation: 768m

    environment:
      DATABASE_URL: ${DATABASE_URL}
      VIRGO_CONFIG_FILE: /app/config.toml
      SUPERVISOR_USERNAME: ${SUPERVISOR_USERNAME}
      SUPERVISOR_PASSWORD: ${SUPERVISOR_PASSWORD}
      SUPERVISOR_SESSION_SECRET: ${SUPERVISOR_SESSION_SECRET}
      SUPERVISOR_TIMEZONE: ${SUPERVISOR_TIMEZONE:-America/Vancouver}

    ports:
      - "${SUPERVISOR_HTTP_PORT:-8010}:8000"

    volumes:
      - ../config.toml:/app/config.toml:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
