name: virgo-source
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: virgo_pg
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure_local.py first}
    volumes:
      - virgo_pg_data:/var/lib/postgresql/data
      - ./pg/init:/docker-entrypoint-initdb.d:ro
      - ./pg/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U admin -d virgo_pg']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/virgo_pg
      VIRGO_CONFIG_FILE: /app/config.toml
    volumes:
      - ./config.toml:/app/config.toml:ro
    ports:
      - "127.0.0.1:${VIRGO_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
  monitor:
    build:
      context: ./monitor
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/virgo_pg
      VIRGO_CONFIG_FILE: /app/config.toml
      SUPERVISOR_USERNAME: ${SUPERVISOR_USERNAME:-admin}
      SUPERVISOR_PASSWORD: ${SUPERVISOR_PASSWORD:?Run python scripts/configure_local.py first}
      SUPERVISOR_SESSION_SECRET: ${SUPERVISOR_SESSION_SECRET:?Run python scripts/configure_local.py first}
      SUPERVISOR_TIMEZONE: ${SUPERVISOR_TIMEZONE:-America/Vancouver}
    volumes:
      - ./monitor/config.toml:/app/config.toml:ro
    ports:
      - "127.0.0.1:${SUPERVISOR_HTTP_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  virgo_pg_data:
