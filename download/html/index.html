<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Virgo APK 下载中心</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--blue-hover:#1d4ed8;--green:#16a34a;--green-hover:#15803d;--shadow:0 10px 30px rgba(15,23,42,.06)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .page{width:min(920px,calc(100% - 32px));margin:0 auto;padding:32px 0 56px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
    .brand h1{margin:0 0 8px;font-size:32px;line-height:1.2}.brand p{margin:0;color:var(--muted);font-size:15px}
    .lang-switch{display:flex;gap:6px;padding:4px;background:#eef2f7;border:1px solid var(--line);border-radius:12px}
    .lang-btn{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:9px;font-weight:700;cursor:pointer}
    .lang-btn.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(15,23,42,.08)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
    .card h2{margin:0 0 8px;font-size:22px}.desc{margin:0 0 18px;color:var(--muted);line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .download{display:flex;align-items:center;justify-content:center;min-height:50px;padding:12px 16px;border-radius:12px;text-decoration:none;color:#fff;background:var(--blue);font-weight:800;transition:.18s ease}
    .download:hover{background:var(--blue-hover);transform:translateY(-1px)}.download.station{background:var(--green)}.download.station:hover{background:var(--green-hover)}
    .note{color:var(--muted);font-size:13px;line-height:1.7;text-align:center;margin-top:22px}code{background:#eef2f7;color:#374151;border-radius:6px;padding:2px 6px}
    @media (max-width:640px){.topbar{align-items:flex-start;flex-direction:column}.brand h1{font-size:27px}.grid{grid-template-columns:1fr}.lang-switch{align-self:flex-end}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><h1 data-i18n="title">Virgo APK 下载中心</h1><p data-i18n="subtitle">点击按钮即可下载对应安装包</p></div>
      <div class="lang-switch" aria-label="Language switch"><button class="lang-btn active" data-lang="zh">中文</button><button class="lang-btn" data-lang="en">English</button></div>
    </header>

    <section class="card">
      <h2 data-i18n="stationTitle">基站端</h2>
      <p class="desc" data-i18n="stationDesc">用于接收短信、发送短信并与 Virgo 服务器通信。</p>
      <div class="grid"><a class="download station" data-file="基站端.apk" href="#"><span data-i18n="stationButton">下载基站端 APK</span></a></div>
    </section>

    <section class="card">
      <h2 data-i18n="clientTitle">客服端</h2>
      <p class="desc" data-i18n="clientDesc">客服端 1 到客服端 5 可分别安装。</p>
      <div class="grid">
        <a class="download" data-file="客服端1.apk" href="#"><span data-i18n="client1">下载客服端 1</span></a>
        <a class="download" data-file="客服端2.apk" href="#"><span data-i18n="client2">下载客服端 2</span></a>
        <a class="download" data-file="客服端3.apk" href="#"><span data-i18n="client3">下载客服端 3</span></a>
        <a class="download" data-file="客服端4.apk" href="#"><span data-i18n="client4">下载客服端 4</span></a>
        <a class="download" data-file="客服端5.apk" href="#"><span data-i18n="client5">下载客服端 5</span></a>
      </div>
    </section>

    <div class="note"><span data-i18n="notePrefix">请确保本文件与</span> <code>基站端.apk</code>、<code>客服端1.apk</code>、<code>客服端2.apk</code>、<code>客服端3.apk</code>、<code>客服端4.apk</code>、<code>客服端5.apk</code> <span data-i18n="noteSuffix">位于同一个文件夹。</span></div>
  </main>

  <script>
    const translations={zh:{title:"Virgo APK 下载中心",subtitle:"点击按钮即可下载对应安装包",stationTitle:"基站端",stationDesc:"用于接收短信、发送短信并与 Virgo 服务器通信。",stationButton:"下载基站端 APK",clientTitle:"客服端",clientDesc:"客服端 1 到客服端 5 可分别安装。",client1:"下载客服端 1",client2:"下载客服端 2",client3:"下载客服端 3",client4:"下载客服端 4",notePrefix:"请确保本文件与",noteSuffix:"位于同一个文件夹。"},en:{title:"Virgo APK Download Center",subtitle:"Select an APK package to download",stationTitle:"Gateway App",stationDesc:"Receives and sends SMS messages and communicates with the Virgo server.",stationButton:"Download Gateway APK",clientTitle:"Agent Apps",clientDesc:"Agent App 1 through Agent App 5 can be installed separately.",client1:"Download Agent App 1",client2:"Download Agent App 2",client3:"Download Agent App 3",client4:"Download Agent App 4",client5:"Download Agent App 5",notePrefix:"Keep this file together with",noteSuffix:"in the same folder."}};
    function setLanguage(lang){const dict=translations[lang]||translations.zh;document.documentElement.lang=lang==="en"?"en":"zh-CN";document.querySelectorAll("[data-i18n]").forEach(el=>{const key=el.getAttribute("data-i18n");if(dict[key])el.textContent=dict[key]});document.querySelectorAll(".lang-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.lang===lang));localStorage.setItem("virgo-language",lang)}
    function buildFreshUrl(fileName){const url=new URL(encodeURIComponent(fileName),window.location.href);url.searchParams.set("v",Date.now().toString());return url.href}
    document.querySelectorAll(".lang-btn").forEach(btn=>btn.addEventListener("click",()=>setLanguage(btn.dataset.lang)));
    document.querySelectorAll("[data-file]").forEach(link=>link.addEventListener("click",event=>{event.preventDefault();window.location.href=buildFreshUrl(link.dataset.file)}));
    const savedLanguage=localStorage.getItem("virgo-language");const browserLanguage=navigator.language.toLowerCase().startsWith("zh")?"zh":"en";setLanguage(savedLanguage||browserLanguage);
  </script>
</body>
</html>
